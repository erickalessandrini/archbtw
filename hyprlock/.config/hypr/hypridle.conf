# hypridle — lock at 10 min, screen off at 15 min, suspend at 45 min on battery only
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# on battery: suspend after 45 min idle (AC never suspends)
listener {
    timeout = 2700
    on-timeout = [ "$(cat /sys/class/power_supply/BAT0/status)" = "Discharging" ] && systemctl suspend
}
