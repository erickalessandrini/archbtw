# hyprlock — Cyberpunk Neon. Background = current wallpaper (symlink kept by wallpaper-next)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/ea2c/.cache/current-wallpaper
    color = rgb(000b1e)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# clock
label {
    monitor =
    text = $TIME
    color = rgb(d7fffe)
    font_size = 90
    font_family = $font
    position = 0, 300
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(0abdc6)
    font_size = 18
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# avatar
image {
    monitor =
    path = /home/ea2c/.face
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgb(00ff9f)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(00ff9f)
    inner_color = rgb(0a1428)
    font_color = rgb(d7fffe)
    check_color = rgb(00b8ff)
    fail_color = rgb(ff2a6d)
    capslock_color = rgb(f9f002)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = <span foreground="##0abdc6">  $USER</span>
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    position = 0, -100
    halign = center
    valign = center
}
